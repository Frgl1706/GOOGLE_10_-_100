
<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>10^100 Search</title>

<!-- Google Material Symbols -->
<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0">

<style>

/* =========================
   基本設定
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    font-family: Arial, "Noto Sans JP", sans-serif;
    color: white;

    background:
        linear-gradient(
            rgba(0,0,0,0.20),
            rgba(0,0,0,0.35)
        ),
        url("BG.png") center center / cover fixed;

    overflow-x: hidden;
}

/* Googleアイコン */

.material-symbols-rounded {
    font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24;

    vertical-align: middle;
}

/* =========================
   ヘッダー
========================= */

header {

    position: fixed;
    top: 0;
    right: 0;

    width: 100%;
    height: 70px;

    padding: 0 30px;

    display: flex;
    justify-content: flex-end;
    align-items: center;

    gap: 25px;

    z-index: 100;

    background: rgba(30, 40, 55, 0.72);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border-bottom: 1px solid rgba(255,255,255,0.25);
}

header a {

    color: white;
    text-decoration: none;

    font-size: 14px;

    cursor: pointer;
}

.header-button {

    color: white;
    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

    width: 42px;
    height: 42px;

    border-radius: 50%;

    transition: 0.25s;
}

.header-button:hover {
    background: rgba(255,255,255,0.18);
}

/* =========================
   アカウントアイコン
========================= */

.account {

    width: 42px;
    height: 42px;

    border-radius: 50%;
    overflow: hidden;

    border: 2px solid rgba(255,255,255,0.8);

    cursor: pointer;

    transition: 0.25s;
}

.account:hover {
    transform: scale(1.08);
}

.account img {

    width: 100%;
    height: 100%;

    object-fit: cover;
}

/* =========================
   ポップアップメニュー
========================= */

.popup {

    display: none;

    position: absolute;

    top: 65px;
    right: 25px;

    width: 270px;

    padding: 20px;

    border-radius: 20px;

    background: rgba(35,45,65,0.90);

    border: 1px solid rgba(255,255,255,0.3);

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    box-shadow: 0 10px 40px rgba(0,0,0,0.3);

    animation: popupIn 0.25s ease;
}

.popup.active {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;
}

.popup-item {

    display: flex;

    flex-direction: column;

    justify-content: center;
    align-items: center;

    gap: 8px;

    padding: 15px 5px;

    border-radius: 15px;

    color: white;
    text-decoration: none;

    cursor: pointer;

    transition: 0.25s;
}

.popup-item:hover {

    background: rgba(255,255,255,0.18);

    transform: translateY(-3px);
}

.popup-item .material-symbols-rounded {
    font-size: 30px;
}

@keyframes popupIn {

    from {
        opacity: 0;
        transform: translateY(-10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================
   メイン画面
========================= */

main {

    min-height: 100vh;

    display: flex;

    flex-direction: column;

    justify-content: center;
    align-items: center;

    padding: 100px 20px 40px;

    text-align: center;
}

/* ロゴ */

.logo {

    font-size: clamp(65px, 10vw, 110px);

    font-weight: bold;

    letter-spacing: -5px;

    text-shadow: 0 5px 25px rgba(0,0,0,0.3);

    animation: fadeIn 1.2s ease;
}

.logo sup {
    font-size: 0.4em;
    vertical-align: super;
}

/* サブタイトル */

.subtitle {

    font-size: 14px;

    letter-spacing: 5px;

    margin-top: 10px;

    opacity: 0.9;
}

/* =========================
   検索ボックス
========================= */

.search-container {

    margin-top: 40px;

    width: min(600px, 90vw);

    padding: 7px;

    display: flex;

    align-items: center;

    border-radius: 50px;

    background: rgba(35,45,65,0.78);

    border: 1px solid rgba(255,255,255,0.4);

    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    box-shadow: 0 10px 40px rgba(0,0,0,0.2);

    transition: 0.3s;
}

.search-container:focus-within {

    background: rgba(45,55,75,0.9);

    box-shadow: 0 0 30px rgba(255,255,255,0.2);

    transform: scale(1.02);
}

.search-container input {

    flex: 1;

    min-width: 0;

    padding: 15px 20px;

    border: none;
    outline: none;

    background: transparent;

    color: white;

    font-size: 17px;
}

.search-container input::placeholder {
    color: rgba(255,255,255,0.75);
}

.search-button {

    width: 48px;
    height: 48px;

    border: none;

    border-radius: 50%;

    background: rgba(255,255,255,0.18);

    color: white;

    cursor: pointer;

    transition: 0.25s;
}

.search-button:hover {
    background: rgba(255,255,255,0.35);
}

.search-button .material-symbols-rounded {
    font-size: 25px;
}

/* =========================
   検索ボタン
========================= */

.buttons {

    margin-top: 25px;

    display: flex;

    gap: 15px;
}

.glass-button {

    padding: 13px 22px;

    color: white;

    background: rgba(35,45,65,0.72);

    border: 1px solid rgba(255,255,255,0.35);

    border-radius: 10px;

    backdrop-filter: blur(15px);

    cursor: pointer;

    font-size: 14px;

    transition: 0.3s;
}

.glass-button:hover {

    background: rgba(65,75,95,0.9);

    transform: translateY(-3px);

    box-shadow: 0 5px 20px rgba(0,0,0,0.2);
}

/* =========================
   スクロールセクション
========================= */

section {

    min-height: 75vh;

    padding: 100px 20px;

    display: flex;

    justify-content: center;
    align-items: center;

    text-align: center;
}

.glass-card {

    max-width: 700px;

    padding: 50px;

    border-radius: 25px;

    background: rgba(35,45,65,0.82);

    border: 1px solid rgba(255,255,255,0.3);

    backdrop-filter: blur(25px);

    box-shadow: 0 15px 50px rgba(0,0,0,0.25);
}

.glass-card h1 {
    margin-bottom: 20px;
}

.glass-card p {
    line-height: 1.8;
}

/* =========================
   スクロールアニメーション
========================= */

.reveal {

    opacity: 0;

    transform: translateY(60px);

    transition:
        opacity 0.8s ease,
        transform 0.8s ease;
}

.reveal.show {

    opacity: 1;

    transform: translateY(0);
}

/* =========================
   フッター
========================= */

footer {

    padding: 30px;

    text-align: center;

    background: rgba(30,40,55,0.75);

    backdrop-filter: blur(15px);

    border-top: 1px solid rgba(255,255,255,0.2);

    font-size: 12px;
}

/* =========================
   フェードアニメーション
========================= */

@keyframes fadeIn {

    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* =========================
   スマートフォン対応
========================= */

@media(max-width:600px) {

    header {
        padding: 0 15px;
        gap: 15px;
    }

    .glass-card {
        padding: 30px 20px;
    }

    .buttons {
        flex-wrap: wrap;
        justify-content: center;
    }

    .logo {
        letter-spacing: -3px;
    }
}

/* 動きを減らす設定 */
@media(prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}

</style>
</head>

<body>

<!-- =========================
     ヘッダー
========================= -->

<header>

    <!-- 10^100 Mail -->

    <a href="#" onclick="openMail(event)">
        10<sup>100</sup>Mail
    </a>

    <!-- アプリ一覧 -->

    <div
        class="header-button"
        onclick="toggleApps(event)"
        title="アプリ一覧"
        aria-label="アプリ一覧"
        aria-expanded="false"
        id="appsButton">

        <span class="material-symbols-rounded">
            apps
        </span>

    </div>

    <!-- アカウント -->

    <div
        class="account"
        onclick="toggleAccount(event)"
        title="アカウント"
        aria-label="アカウント"
        aria-expanded="false"
        id="accountButton">

        <img
            src="10100icon.jpg"
            alt="10^100 アカウント">

    </div>

    <!-- アプリ一覧ポップアップ -->

    <div class="popup" id="apps">

        <a class="popup-item"
           href="#"
           onclick="showMessage('10^100 Search')">

            <span class="material-symbols-rounded">
                search
            </span>

            <span>検索</span>

        </a>

        <a class="popup-item"
           href="#"
           onclick="openMail(event)">

            <span class="material-symbols-rounded">
                mail
            </span>

            <span>メール</span>

        </a>

        <a class="popup-item"
           href="#"
           onclick="showMessage('10^100 Drive')">

            <span class="material-symbols-rounded">
                folder
            </span>

            <span>ドライブ</span>

        </a>

        <a class="popup-item"
           href="#"
           onclick="showMessage('10^100 Images')">

            <span class="material-symbols-rounded">
                image
            </span>

            <span>画像</span>

        </a>

    </div>

    <!-- アカウントポップアップ -->

    <div class="popup" id="account">

        <div style="grid-column:span 2;text-align:center">

            <img
                src="10100icon.jpg"
                width="75"
                height="75"
                style="border-radius:50%;object-fit:cover">

            <p style="margin-top:15px">
                <b>10<sup>100</sup> アカウント</b>
            </p>

            <small>10^100へようこそ</small>

            <p style="margin-top:15px">
                <button
                    class="glass-button"
                    onclick="showMessage('アカウント設定')">

                    アカウント設定

                </button>
            </p>

        </div>

    </div>

</header>


<!-- =========================
     メイン画面
========================= -->

<main>

    <!-- ロゴ -->

    <div class="logo">
        10<sup>100</sup>
    </div>

    <div class="subtitle">
        無限の可能性を検索する
    </div>


    <!-- 検索フォーム -->

    <form
        class="search-container"
        onsubmit="search(event)">

        <input
            id="searchInput"
            type="text"
            placeholder="10^100 で検索..."
            autocomplete="off"
            aria-label="検索キーワード">

        <button
            class="search-button"
            type="submit"
            aria-label="検索">

            <span class="material-symbols-rounded">
                search
            </span>

        </button>

    </form>


    <!-- 検索ボタン -->

    <div class="buttons">

        <button
            class="glass-button"
            onclick="searchGoogle()">

            10<sup>100</sup> 検索

        </button>

        <button
            class="glass-button"
            onclick="lucky()">

            I'm Feeling Lucky

        </button>

    </div>

</main>


<!-- =========================
     下部コンテンツ
========================= -->

<section>

    <div class="glass-card reveal">

        <h1>
            10<sup>100</sup> へようこそ
        </h1>

        <p>
            あらゆる情報へのアクセスを、ここから始めましょう。
            <br>
            あなたの検索体験に新しい可能性を。
        </p>

    </div>

</section>


<section>

    <div class="glass-card reveal">

        <h1>
            想像を超える、その先へ。
        </h1>

        <p>
            10<sup>100</sup> は、無限の可能性を象徴する検索ポータルです。
        </p>

    </div>

</section>


<!-- =========================
     フッター
========================= -->

<footer>

    © 2026 10^100 Project

</footer>


<!-- =========================
     JavaScript
========================= -->

<script>

/* =========================
   ハプティクス
========================= */

function haptic() {

    if (navigator.vibrate) {
        navigator.vibrate(20);
    }

}


/* =========================
   ポップアップ制御
========================= */

function closePopups() {

    document.getElementById("apps")
        .classList.remove("active");

    document.getElementById("account")
        .classList.remove("active");

    document.getElementById("appsButton")
        .setAttribute("aria-expanded", "false");

    document.getElementById("accountButton")
        .setAttribute("aria-expanded", "false");

}


function toggleApps(event) {

    haptic();

    event.stopPropagation();

    const apps = document.getElementById("apps");

    const account = document.getElementById("account");

    const wasOpen = apps.classList.contains("active");

    closePopups();

    if (!wasOpen) {

        apps.classList.add("active");

        document.getElementById("appsButton")
            .setAttribute("aria-expanded", "true");

    }

}


function toggleAccount(event) {

    haptic();

    event.stopPropagation();

    const account = document.getElementById("account");

    const apps = document.getElementById("apps");

    const wasOpen = account.classList.contains("active");

    closePopups();

    if (!wasOpen) {

        account.classList.add("active");

        document.getElementById("accountButton")
            .setAttribute("aria-expanded", "true");

    }

}


/* 外側クリックで閉じる */

document.addEventListener("click", function(event) {

    const apps = document.getElementById("apps");

    const account = document.getElementById("account");

    const appsButton = document.getElementById("appsButton");

    const accountButton = document.getElementById("accountButton");

    if (
        !apps.contains(event.target) &&
        !account.contains(event.target) &&
        !appsButton.contains(event.target) &&
        !accountButton.contains(event.target)
    ) {

        closePopups();

    }

});


/* =========================
   Google検索
========================= */

function search(event) {

    event.preventDefault();

    searchGoogle();

}


function searchGoogle() {

    haptic();

    const query =
        document.getElementById("searchInput").value.trim();

    if (!query) return;

    window.open(
        "https://www.google.com/search?q=" +
        encodeURIComponent(query),
        "_blank",
        "noopener,noreferrer"
    );

}


function lucky() {

    haptic();

    const query =
        document.getElementById("searchInput").value.trim();

    if (!query) return;

    window.open(
        "https://www.google.com/search?q=" +
        encodeURIComponent(query) + "&btnI=1",
        "_blank",
        "noopener,noreferrer"
    );

}


/* =========================
   10^100 Mail
========================= */

function openMail(event) {

    event.preventDefault();

    haptic();

    showMessage(
        "10^100 Mail は現在準備中です。"
    );

}


/* =========================
   アプリメッセージ
========================= */

function showMessage(message) {

    haptic();

    closePopups();

    alert(message);

}


/* =========================
   スクロールアニメーション
========================= */

const observer = new IntersectionObserver(

    entries => {

        entries.forEach(entry => {

            if (entry.isIntersecting) {

                entry.target.classList.add("show");

            }

        });

    },

    {
        threshold: 0.15
    }

);


document.querySelectorAll(".reveal").forEach(element => {

    observer.observe(element);

});


/* =========================
   背景パララックス
========================= */

let ticking = false;

window.addEventListener("scroll", () => {

    if (ticking) return;

    ticking = true;

    requestAnimationFrame(() => {

        if (window.matchMedia(
            "(prefers-reduced-motion: reduce)"
        ).matches) {

            ticking = false;
            return;

        }

        const offset = window.scrollY;

        document.body.style.backgroundPosition =
            `center ${offset * 0.15}px`;

        ticking = false;

    });

}, { passive: true });


/* =========================
   Enterキーによる操作
========================= */

document.getElementById("searchInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Escape") {

            this.value = "";

        }

    });

</script>

</body>
</html>
